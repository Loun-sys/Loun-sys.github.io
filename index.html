<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Чарлист — Адольф Грау</title>
<style>
body{
  margin:0;
  background:#000;
  color:#e5e5e5;
  font-family:Segoe UI, sans-serif;
}
.wrap{max-width:1200px;margin:auto;padding:20px;}
h1{text-align:center;letter-spacing:4px;text-transform:uppercase;}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;}
.card{border:1px solid #333;border-radius:14px;padding:14px;background:#050505;box-shadow:0 0 20px rgba(255,255,255,.05);position:relative;}
.label{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#888;margin-bottom:6px;}
input,textarea{width:100%;background:#0b0b0b;border:1px solid #333;color:#eee;border-radius:8px;padding:8px;margin:4px 0;}
button{background:#111;border:1px solid #444;color:#ccc;padding:8px;border-radius:8px;cursor:pointer;}
button:hover{border-color:#aaa;color:#fff;}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid #666;background:#111;cursor:pointer;}
.dot.active{background:#fff;border-color:#fff}
.counter{font-size:11px;color:#666;margin-top:4px;margin-bottom:8px;}
.item{position:relative;border:1px solid #333;border-radius:10px;padding:10px;margin-top:8px;background:#0a0a0a;}
.del{position:absolute;right:8px;top:6px;color:#555;cursor:pointer;}
.del:hover{color:#fff;}
.moveBtn{font-size:12px;margin-top:6px;}
#portraitBox{border:1px solid #333;border-radius:12px;height:260px;display:flex;align-items:center;justify-content:center;color:#444;cursor:pointer;overflow:hidden;margin-bottom:10px;background:#111;}
#portraitBox:hover{border-color:#777;color:#777;}
#portraitBox img{width:100%;height:100%;object-fit:contain;}
.addBtn{position:absolute;top:10px;right:10px;width:24px;height:24px;border-radius:50%;border:none;font-size:18px;font-weight:bold;line-height:18px;text-align:center;cursor:pointer;color:#ccc;background:#111;}
.addBtn:hover{color:#fff;}
.addForm{display:none;margin-top:6px;}
.addForm input, .addForm textarea{font-size:12px;padding:6px;}
.addForm button{padding:4px 8px;font-size:12px;margin-top:4px;}

/* Таланты с фиксированной высотой и скроллом */
#talents {
  max-height:300px;
  overflow-y:auto;
  margin-top:6px;
  padding-right:4px;
}
#talents::-webkit-scrollbar {width:6px;}
#talents::-webkit-scrollbar-track {background:#111;}
#talents::-webkit-scrollbar-thumb {background:#444;border-radius:3px;}
#talents::-webkit-scrollbar-thumb:hover {background:#666;}
</style>
</head>
<body>
<div class="wrap">
<h1>Чарлист — Адольф Грау</h1>

<div class="grid">
<div class="card">
<div class="label">Персонаж</div>
<input id="charName" placeholder="Имя персонажа">
<div id="portraitBox" onclick="imgInput.click()">Портрет</div>
<input id="imgInput" type="file" accept="image/*" hidden>
</div>

<div class="card">
<div class="label">Характеристики</div>
<div id="stats"></div>
</div>

<div class="card" id="talCard">
<div class="label">Таланты</div>
<button class="addBtn" onclick="toggleForm('talForm')">+</button>
<div class="addForm" id="talForm"></div>
<div id="talents"></div>
</div>
</div>

<div class="grid">
<div class="card"><div class="label">Телосложение — навыки:</div><div id="s_body"></div></div>
<div class="card"><div class="label">Ловкость — навыки:</div><div id="s_agl"></div></div>
<div class="card"><div class="label">Смекалка — навыки:</div><div id="s_mind"></div></div>
<div class="card"><div class="label">Эмпатия — навыки:</div><div id="s_emp"></div></div>
</div>

<div class="grid">
<div class="card" id="invCard"><div class="label">Инвентарь</div><button class="addBtn" onclick="toggleForm('invForm')">+</button>
<div class="addForm" id="invForm"></div>
<div id="inventory"></div></div>

<div class="card" id="stashCard"><div class="label">Склад</div><button class="addBtn" onclick="toggleForm('stashForm')">+</button>
<div class="addForm" id="stashForm"></div>
<div id="stash"></div></div>
</div>

</div>

<script>
const STORE_KEY="dark_sheet_final";

let STATE = {
  name: "Адольф Грау",
  portrait: "https://i.pinimg.com/736x/31/31/be/3131be8cf94d75abe81a15f97e8c70dc.jpg",
  stats: {
    stat_body: 4,
    stat_agl: 2,
    stat_mind: 5,
    stat_emp: 3
  },
  skills: {
    skill_body_Сила: 0,
    skill_body_Выносливость: 0,
    skill_body_Драка: 5,
    skill_agl_Скрытность:0,
    skill_agl_Проворность:0,
    skill_agl_Стрельба:0,
    skill_mind_Наблюдательность:4,
    skill_mind_Анализ:1,
    skill_mind_Знания:0,
    skill_mind_Ремесло:5,
    skill_emp_Проницательность:0,
    skill_emp_Влияние:0,
    skill_emp_Лечение:0
  },
  talents: [
    {n:"Изобретатель", d:"При первом усовершенствовании предмета, персонаж не тратит компонент."},
    {n:"Ритуалистика", d:'Вы владеете ритуальной магией. Персонажу доступны следующие ритуалы: <a href="https://docs.google.com/document/d/1TjCmSpLfW43ABwKMRuDI0SVO7V-yb8NkzwuFxlVsFq4/edit?usp=sharing" target="_blank">*Займ у будущего*</a>'},
    {n:"Девять Жизней", d:"Вы можете перекинуть кубы при броске на травму. Выбор выпавших травм опционален."},
    {n:"Упорный", d:"Вы можете пойти на Риск дважды"},
    {n:"Чугунный Козырь", d:"Вы создали себе еще одну конечность — руку, которая управляется вашей волей. Вы имеете возможность держать предметы в этой конечности. Конечность не обладает тактильностью, а ее ранение не причиняет вам боли."}
  ],
  inventory:[
    {n:"Глефа", d:"Оружие. Двуручное. 2 прочности. 3 урона; дистанция ближняя; режущее; сбивающее; разоружающее; освященное."}        
    {n:"Кираса Смотрителей", d:"Доспех. 5 прочности. +3 к кубам против дьявольщины; освященное."}        
    {n:"Набор инструментов", d:"Снаряжение. 3 прочности. Прибавка к проверкам ремесла, равная прочности инструментов."}     
    {n:"Фонарь", d:"Снаряжение. ...А я думал, что вы заставите повесить мне на хуй электрический фонарь и работать в три смены (Анекдот про Брежнева)."}        
    {n:"Павеза", d:"Щит. Одноручное. 4 прочности. повышает требование успехов для проверок ловкости на 1, пока щит в руках; позволяет гарантированно защититься от 2 дробящего урона ценой 1 прочности: щита; снижает получаемый урон от атак, которые можно заблокировать, на 1;
    {n:"Музыкальный проигрыватель", d:"Безделушка/Артефакт. Маленькое устройство, способно проигрывать музыку на незнакомом языке, обладает функцией записи. В комплекте идут кассеты с записанной музыкой и пустые болванки. Устройство этого проигрывателя в корне отличается от любых других технических устройств Империи."}        
"}        
  ],
  stash:[
    {n:"Глефа", d:"Оружие. Двуручное. 2 прочности. 3 урона; дистанция ближняя; режущее; сбивающее; разоружающее; освященное."}
    {n:"Легкий арбалет", d:"Оружие. Одноручное. 1 прочности. 2 урона; дистанция средняя; колющее; тихое; разрушающее; перезарядка."}      
    {n:"Компонент", d:"Предмет крафта. 9 штук."}        
    {n:"Ящик с деталями", d:"Предмет крафта. Каждый ящик содержит достаточно крупное количество бракованных деталей. Чтобы получить из этого ящика хлама небольшое количество полезных деталей, понадобится бросок ремесла со сложностью 2. Из ящика получается максимум 1 компонент. Также каждый ящик требует очень большого времени, чтобы разобрать мусор. Имеет ограничение на один ящик в сцену.
."}        
  ]
};

function save(){localStorage.setItem(STORE_KEY,JSON.stringify(STATE))}
function load(){const s=localStorage.getItem(STORE_KEY);if(s) STATE=JSON.parse(s)}

function dotRow(container,key,max,stored={}){
  let val=stored[key]||0;
  const wrap=document.createElement("div");wrap.className="dots";
  const counter=document.createElement("div");counter.className="counter";
  function redraw(){
    counter.textContent=val+"/"+max;
    [...wrap.children].forEach((d,i)=>d.classList.toggle("active",i<val));
    stored[key]=val; save();
  }
  for(let i=1;i<=max;i++){const d=document.createElement("div");d.className="dot";d.onclick=()=>{val=(val===i)?i-1:i; redraw();};wrap.appendChild(d);}
  container.appendChild(wrap);
  container.appendChild(counter);
  redraw();
}

function statBlock(name,max,key){
  const c=document.createElement("div");
  const l=document.createElement("div");l.className="label";l.textContent=name;
  c.appendChild(l);
  dotRow(c,key,max,STATE.stats);
  return c;
}

const statsDiv=document.getElementById("stats");
[["Телосложение",4,"stat_body"],["Смекалка",5,"stat_mind"],["Ловкость",2,"stat_agl"],["Эмпатия",3,"stat_emp"]].forEach(s=>statsDiv.appendChild(statBlock(s[0],s[1],s[2])));

function skillSet(id,names,keyPrefix){
  const root=document.getElementById(id);
  names.forEach(n=>{
    const c=document.createElement("div");
    const l=document.createElement("div");l.className="label";l.textContent=n;c.appendChild(l);
    dotRow(c,keyPrefix+n,5,STATE.skills);
    root.appendChild(c);
  });
}

skillSet("s_body",["Сила","Выносливость","Драка"],"skill_body_");
skillSet("s_agl",["Скрытность","Проворность","Стрельба"],"skill_agl_");
skillSet("s_mind",["Наблюдательность","Анализ","Знания","Ремесло"],"skill_mind_");
skillSet("s_emp",["Проницательность","Влияние","Лечение"],"skill_emp_");

function drawPortrait(){
  const box=document.getElementById("portraitBox");
  box.innerHTML=STATE.portrait?"<img src='"+STATE.portrait+"'>":"Портрет";
}
const imgInput=document.getElementById("imgInput");
imgInput.onchange=e=>{
  const f=e.target.files[0];
  const r=new FileReader();
  r.onload=()=>{STATE.portrait=r.result;save();drawPortrait();};
  r.readAsDataURL(f);
};

const charName=document.getElementById("charName");
charName.value=STATE.name||"";
charName.oninput=e=>{STATE.name=e.target.value;save();};

function renderTalents(){
  const box=document.getElementById("talents");box.innerHTML="";
  STATE.talents.forEach((t,i)=>{
    const d=document.createElement("div");d.className="item";
    d.innerHTML="<div class='del'>✕</div><b>"+t.n+"</b><div>"+t.d+"</div>";
    d.querySelector(".del").onclick=()=>{STATE.talents.splice(i,1);save();renderTalents();}
    box.appendChild(d);
  });
}

function addTalent(){if(!talName.value)return;STATE.talents.push({n:talName.value,d:talDesc.value});talName.value="";talDesc.value="";save();renderTalents();}

function addItem(data,other,n,d){data.push({n,d});save(); renderAll();}
function renderList(id,data,other){
  const box=document.getElementById(id);box.innerHTML="";
  data.forEach((it,i)=>{
    const d=document.createElement("div");d.className="item";
    d.innerHTML="<div class='del'>✕</div><b>"+it.n+"</b><div>"+it.d+"</div>";
    d.querySelector(".del").onclick=()=>{data.splice(i,1);save();renderAll();}
    if(other){const b=document.createElement("button");b.className="moveBtn";b.textContent="Переместить";b.onclick=()=>{other.push(it);data.splice(i,1);save();renderAll()};d.appendChild(b);}
    box.appendChild(d);
  });
}

function addControls(root,data,other){
  const r=document.getElementById(root);
  const n=document.createElement("input");n.placeholder="Название";
  const d=document.createElement("textarea");d.placeholder="Описание";
  const b=document.createElement("button");b.textContent="Добавить";
  b.onclick=()=>{if(!n.value)return; addItem(data,other,n.value,d.value); n.value=""; d.value="";};
  r.append(n,d,b);
}

function toggleForm(id){const f=document.getElementById(id);f.style.display=f.style.display==="block"?"none":"block";}
function renderAll(){renderTalents();renderList("inventory",STATE.inventory,STATE.stash);renderList("stash",STATE.stash,STATE.inventory);drawPortrait();}

addControls("invForm",STATE.inventory,STATE.stash);
addControls("stashForm",STATE.stash,STATE.inventory);
addControls("talForm",STATE.talents,null);

load();
charName.value=STATE.name||"";
drawPortrait();
renderAll();
</script>
</body>
</html>
